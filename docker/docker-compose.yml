services:
  postgres:
    image: postgres:16-alpine
    container_name: cpfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpfa
      POSTGRES_PASSWORD: cpfa
      POSTGRES_DB: cpfa
    ports:
      - "5434:5432"
    volumes:
      - cpfa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpfa -d cpfa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cpfa-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - cpfa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cpfa-postgres-data:
  cpfa-redis-data:
