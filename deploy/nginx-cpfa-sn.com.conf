# /etc/nginx/sites-available/cpfa-sn.com
# Reverse proxy: cpfa-sn.com / www.cpfa-sn.com  →  127.0.0.1:3010 (cpfa-prod web container)
#
# This vhost coexists with the existing `premiumconnect` default_server on :80.
# A specific server_name match wins over default_server, so this vhost only
# handles cpfa-sn.com / www.cpfa-sn.com.

upstream cpfa_web {
    server 127.0.0.1:3010;
    keepalive 32;
}

# Stage 1: HTTP only (used until certbot installs TLS).
# certbot --nginx will rewrite this block into 80→443 redirect + 443 TLS server.
server {
    listen 80;
    listen [::]:80;
    server_name cpfa-sn.com www.cpfa-sn.com;

    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml application/manifest+json;

    # Basic security headers (more added by Next.js itself).
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;

    # Health probe — no logging, no rate limit.
    location = /api/health {
        access_log off;
        proxy_pass http://cpfa_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js standalone.
    location / {
        proxy_pass http://cpfa_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 90s;
    }
}
